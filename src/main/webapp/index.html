<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/main.css" type="text/css">

</head>
<body>
    <h1>CD list</h1>
    <table>
        <tr>
            <th>Description</th>
            <th class="right">Price</th>
            <th>&nbsp;</th>
        </tr>

        <tr>
            <td>86 (the band) - True Life Songs and Pictures</td>
            <td class="right">$14.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="productCode" value="86 (the band)">
                    <input type="submit" value="Add To Cart">
                </form>
            </td>
        </tr>
        <tr>
            <td>Paddlefoot - The First CD</td>
            <td class = "right">$12.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="productCode" value="Paddlefoot01">
                    <input type="submit" value="Add To Cart">
                </form>
            </td>
        </tr>
        <tr>
            <td>Paddlefoot - The second CD</td>
            <td class = "right">$14.95</td>
            <td>
                <form action = "cart" method="post">
                    <input type="hidden" name = "productCode" value = "Paddlefoot02">
                    <input type="submit" value="Add To Cart">
                </form>
            </td>
        </tr>
        <tr>
            <td>Joe Rut - Genuine Wood Grained Finish</td>
            <td class = "right">$14.95</td>
            <td>
                <form action="cart" method="post">
                    <input type="hidden" name="productCode" value="JoeRut">
                    <input type="submit" value="Add To Cart">
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
